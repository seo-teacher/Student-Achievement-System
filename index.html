  <!-- ★★★ Firebase 초기화 + 마이그레이션 로직 (기존 LOCAL MOCK BACKEND 대체) ★★★ -->
  <script>
  (function () {
    const firebaseConfig = {
      apiKey: "AIzaSyCsTp3b8c8b7irJ-HArmtN8a8F6ltL0xx4",
      authDomain: "student-achievement-syst-280f8.firebaseapp.com",
      projectId: "student-achievement-syst-280f8",
      storageBucket: "student-achievement-syst-280f8.firebasestorage.app",
      messagingSenderId: "1042051721581",
      appId: "1:1042051721581:web:f92e803a637d92d6e59264"
    };

    firebase.initializeApp(firebaseConfig);
    const _db = firebase.firestore();

    // (선택) 오프라인 캐시 활성화 — 다중 탭 지원
    try {
      _db.enablePersistence({ synchronizeTabs: true }).catch(()=>{});
    } catch(e) { /* ignore */ }

    // 기존 React 코드가 사용하는 전역 객체와 호환되도록 노출
    window.db = _db;
    window.FieldValue = firebase.firestore.FieldValue;
    // window.firebase 는 compat SDK가 이미 전역으로 노출
    console.log('%c[Firestore] 연결됨', 'color:#0ea5e9;font-weight:bold;',
      firebaseConfig.projectId);

    /* ===== localStorage → Firestore 마이그레이션 ===== */
    const OLD_KEY = 'myeongin_db_v3';
    const MIGRATED_FLAG = 'myeongin_migrated_at_v1';
    const fab = document.getElementById('migration-fab');
    const btn = document.getElementById('migration-btn');
    const statusEl = document.getElementById('migration-status');

    const hasOldData = () => {
      try {
        const raw = localStorage.getItem(OLD_KEY);
        if (!raw) return false;
        const obj = JSON.parse(raw);
        return obj && typeof obj === 'object' && Object.keys(obj).length > 0;
      } catch { return false; }
    };
    const alreadyMigrated = () => !!localStorage.getItem(MIGRATED_FLAG);

    // 표시 여부 결정
    if (hasOldData() && !alreadyMigrated()) {
      fab.style.display = 'block';
    } else {
      fab.style.display = 'none';
    }

    // 옛 저장 구조에 있던 {__t:'ts', iso:'...'} 형태를 Firestore Timestamp 로 복원
    const Timestamp = firebase.firestore.Timestamp;
    const revive = (v) => {
      if (v && typeof v === 'object' && v.__t === 'ts') {
        return Timestamp.fromDate(new Date(v.iso));
      }
      if (Array.isArray(v)) return v.map(revive);
      if (v && typeof v === 'object') {
        const o = {};
        for (const k in v) o[k] = revive(v[k]);
        return o;
      }
      return v;
    };

    btn.addEventListener('click', async () => {
      if (!confirm(
        '이 기기의 localStorage 데이터를 Firestore로 옮길까요?\n\n' +
        '· 같은 문서 ID가 이미 Firestore에 있으면 덮어쓰여집니다.\n' +
        '· 학생/일지/설정 전체가 한꺼번에 이전됩니다.\n\n' +
        '계속하시겠어요?'
      )) return;

      btn.disabled = true;
      statusEl.textContent = '⏳ 이전 중…';
      try {
        const raw = localStorage.getItem(OLD_KEY);
        const store = JSON.parse(raw || '{}');
        let total = 0, perColl = {};

        for (const collName in store) {
          const coll = store[collName] || {};
          const ids = Object.keys(coll);
          perColl[collName] = ids.length;

          // Firestore batch 한도(500)보다 안전하게 400씩 쪼개기
          for (let i = 0; i < ids.length; i += 400) {
            const batch = _db.batch();
            ids.slice(i, i + 400).forEach(id => {
              const data = revive(coll[id]);
              batch.set(_db.collection(collName).doc(id), data, { merge: true });
            });
            await batch.commit();
          }
          total += ids.length;
        }

        localStorage.setItem(MIGRATED_FLAG, new Date().toISOString());
        const summary = Object.entries(perColl)
          .map(([k,v])=>`${k}: ${v}건`).join(' / ') || '(데이터 없음)';
        statusEl.style.color = '#059669';
        statusEl.textContent = `✅ 완료 — 총 ${total}건 이전됨 (${summary})`;
        btn.textContent = '✓ 이전 완료';
        alert(
          `✅ Firestore 이전 완료!\n\n총 ${total}건이 옮겨졌어요.\n${summary}\n\n` +
          '※ 원본 localStorage 데이터는 안전하게 그대로 남아 있어요.\n' +
          '문제가 없는지 확인 후 직접 지워주세요.'
        );
        setTimeout(()=>{ fab.style.display='none'; }, 3000);
      } catch (err) {
        console.error(err);
        statusEl.style.color = '#dc2626';
        statusEl.textContent = '❌ 실패: ' + (err.message || err);
        btn.disabled = false;
        alert('이전 중 오류가 발생했어요.\n\n' + (err.message || err) +
          '\n\nFirestore 보안 규칙(Rules)이 쓰기를 허용하는지 먼저 확인해 주세요.');
      }
    });
  })();
  </script>
